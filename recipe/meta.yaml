{% set version = "0.5.5" %}
{% set posix = 'm2-' if win else '' %}

package:
  name: r-lime
  version: {{ version|replace("-", "_") }}

source:
  url:
    - {{ cran_mirror }}/src/contrib/lime_{{ version }}.tar.gz
    - {{ cran_mirror }}/src/contrib/Archive/lime/lime_{{ version }}.tar.gz
  sha256: 3ca1fce940e36770db100a2da25aa70f67e6bbb169db0fad4174f9ab35ff681a

build:
  number: 0
  rpaths:
    - lib/R/lib/
    - lib/

requirements:
  build:
    - {{ compiler('c') }}        # [not win]
    - {{ stdlib("c") }}          # [not win]
    - {{ compiler('cxx') }}      # [not win]
    - {{ compiler('m2w64_c') }}        # [win]
    - {{ stdlib("m2w64_c") }}          # [win]
    - {{ compiler('m2w64_cxx') }}        # [win]
    - {{ posix }}filesystem        # [win]
    - {{ posix }}make
    - {{ posix }}sed               # [win]
    - {{ posix }}coreutils         # [win]
    - {{ posix }}zip               # [win]
  host:
    - r-base
    - r-matrix
    - r-rcpp
    - r-rcppeigen
    - r-assertthat
    - r-ggplot2
    - r-glmnet
    - r-gower
    - r-htmlwidgets
    - r-shiny
    - r-shinythemes
    - r-stringi
  run:
    - r-base
    - r-matrix
    - r-rcpp
    - r-rcppeigen
    - r-assertthat
    - r-ggplot2
    - r-glmnet
    - r-gower
    - r-htmlwidgets
    - r-shiny
    - r-shinythemes
    - r-stringi

test:
  commands:
    - $R -e "library('lime')"           # [not win]
    - "\"%R%\" -e \"library('lime')\""  # [win]

about:
  home: https://github.com/thomasp85/lime
  license: MIT
  license_file: LICENSE
  summary: When building complex models, it is often difficult to explain why the model should be trusted. While global measures such as accuracy are useful, they cannot be used for explaining why a model made a specific prediction. 'lime' (a port of the 'lime' 'Python' package) is a method for explaining the outcome 
    of black box models by fitting a local model around the point in question an perturbations of this point. The approach is described in more detail in the article by Ribeiro et al. (2016)  <arXiv:1602.04938>.
  license_family: MIT

extra:
  recipe-maintainers:
    - conda-forge/r

